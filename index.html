<!doctype html><html><head><meta charset="utf-8"><link rel="preload" href="forced_square.woff2" as="font" type="font/woff2" crossorigin="anonymous"/><link rel="preload" href="images/logo.svg" as="image" type="image/svg+xml"/><link rel="preload" href="images/discord.svg" as="image" type="image/svg+xml"/><link rel="manifest" href="manifest.json"/><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<script>
(function () {
  const OriginalWorker = window.Worker;
  let inCount = 0;

  function tryFloatOffsets(bytes) {
    // Try reading the byte array as float32s starting at every possible
    // byte offset (0..3), so we can compare against the on-screen speed.
    const results = {};
    for (let offset = 0; offset < 4; offset++) {
      const usable = bytes.length - offset;
      const floatCount = Math.floor(usable / 4);
      if (floatCount <= 0) { results['offset' + offset] = []; continue; }
      const slice = bytes.slice(offset, offset + floatCount * 4);
      const floats = Array.from(new Float32Array(slice.buffer, slice.byteOffset, floatCount))
        .map(n => Math.round(n * 100) / 100);
      results['offset' + offset] = floats;
    }
    return results;
  }

  window.Worker = function (...args) {
    try { console.log('[SPY] worker created:', args); } catch (e) {}
    const worker = new OriginalWorker(...args);
    const originalPostMessage = worker.postMessage.bind(worker);

    worker.postMessage = function (msg, ...rest) {
      try {
        if (msg && msg.messageType === 6) {
          // ControlCar - log every input change
          console.log('[SPY] -> ControlCar:', {up: msg.up, right: msg.right, down: msg.down, left: msg.left, reset: msg.reset});
        }
      } catch (e) {}
      return originalPostMessage(msg, ...rest);
    };

    worker.addEventListener('message', (e) => {
      try {
        const data = e.data;
        if (data && data.messageType === 10 && data.carStateBuffers) {
          inCount++;
          if (inCount % 30 === 0) {
            for (const buf of data.carStateBuffers) {
              const allBytes = new Uint8Array(buf);
              const carId = allBytes[0] | (allBytes[1] << 8) | (allBytes[2] << 16) | (allBytes[3] << 24);
              const rest = allBytes.slice(4);
              console.log('[SPY] carId:', carId, 'restBytes:', Array.from(rest), 'floatAttempts:', tryFloatOffsets(rest));
            }
          }
        }
      } catch (err) { console.log('[SPY] log error (safe to ignore):', err); }
    });

    return worker;
  };
  window.Worker.prototype = OriginalWorker.prototype;
})();
</script>
