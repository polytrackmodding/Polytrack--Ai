<script>
(function () {
  const OriginalWorker = window.Worker;
  let outCount = 0, inCount = 0;
  window.Worker = function (...args) {
    console.log('[SPY] worker created:', args);
    const worker = new OriginalWorker(...args);
    const originalPostMessage = worker.postMessage.bind(worker);
    worker.postMessage = function (msg, ...rest) {
      if (msg && msg.messageType === 3) {
        console.log('[SPY] -> INIT (messageType 3), keys:', Object.keys(msg));
      } else {
        outCount++;
        if (outCount % 60 === 0) {
          console.log('[SPY] -> input:', JSON.parse(JSON.stringify(msg)));
        }
      }
      return originalPostMessage(msg, ...rest);
    };
    worker.addEventListener('message', (e) => {
      const data = e.data;
      if (data && data.messageType === 10 && data.carStateBuffers) {
        inCount++;
        if (inCount % 60 === 0) {
          const decoded = data.carStateBuffers.map(buf => Array.from(buf));
          console.log('[SPY] <- STATE decoded:', JSON.stringify(decoded));
        }
      } else {
        console.log('[SPY] <- other:', data);
      }
    });
    return worker;
  };
  window.Worker.prototype = OriginalWorker.prototype;
})();
</script>
