<!doctype html><html><head><meta charset="utf-8"><link rel="preload" href="forced_square.woff2" as="font" type="font/woff2" crossorigin="anonymous"/><link rel="preload" href="images/logo.svg" as="image" type="image/svg+xml"/><link rel="preload" href="images/discord.svg" as="image" type="image/svg+xml"/><link rel="manifest" href="manifest.json"/><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<script>
(function () {
  const workerRefs = [];
  const checkpointsByCar = {};
  const lastCkptByCar = {};

  const OriginalWorker = window.Worker;
  window.Worker = function (...args) {
    const w = new OriginalWorker(...args);
    try {
      if (args[0] && String(args[0]).includes('simulation_worker')) {
        workerRefs.push(w);
        console.log('[PolyAI] captured simulation worker');
      }
    } catch (e) {}
    return w;
  };
  window.Worker.prototype = OriginalWorker.prototype;

  function isSmallInt(k) { return typeof k === 'number' && Number.isInteger(k) && k >= 0 && k < 100000; }

  const OriginalMapSet = Map.prototype.set;
  Map.prototype.set = function (key, value) {
    if (isSmallInt(key) && typeof value === 'function' && !value.__isSpyWrapped) {
      const wrapped = function (...args) {
        try {
          const arg = args[0];
          if (arg && typeof arg === 'object' && 'speedKmh' in arg && 'position' in arg) {
            if (!checkpointsByCar[key]) checkpointsByCar[key] = {};
            const lastForThisCar = lastCkptByCar[key] ?? -1;

            if (arg.nextCheckpointIndex > lastForThisCar) {
              const idx = Math.max(0, arg.nextCheckpointIndex - 1);
              if (checkpointsByCar[key][idx] == null) {
                checkpointsByCar[key][idx] = { x: arg.position.x, z: arg.position.z };
                console.log(`%c[PolyAI] car ${key}: recorded checkpoint ${idx} (total for this car: ${Object.keys(checkpointsByCar[key]).length})`, 'color: lime');
              }
              lastCkptByCar[key] = arg.nextCheckpointIndex;
            }
          }
        } catch (e) {}
        return value.apply(this, args);
      };
      wrapped.__isSpyWrapped = true;
      return OriginalMapSet.call(this, key, wrapped);
    }
    return OriginalMapSet.call(this, key, value);
  };

  window.PolyAI = {
    listCars() {
      const summary = {};
      for (const id of Object.keys(checkpointsByCar)) summary[id] = Object.keys(checkpointsByCar[id]).length;
      console.log('[PolyAI] Checkpoints recorded per car:', summary);
      return summary;
    },
    downloadCheckpoints(carId) {
      let id = carId;
      if (id === undefined) {
        // default: pick whichever car has the MOST recorded checkpoints (likely the real player)
        id = Object.keys(checkpointsByCar).reduce((best, k) =>
          Object.keys(checkpointsByCar[k]).length > Object.keys(checkpointsByCar[best] || {}).length ? k : best, Object.keys(checkpointsByCar)[0]);
      }
      const data = checkpointsByCar[id];
      if (!data) { console.warn('[PolyAI] No data for car', id); return; }
      const list = Object.keys(data).map(Number).sort((a, b) => a - b).map(i => data[i]);
      const blob = new Blob([JSON.stringify(list)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'checkpoints.json'; a.click();
      console.log(`[PolyAI] Downloaded ${list.length} checkpoints from car ${id}`);
    },
  };

  console.log('[PolyAI] Checkpoint recorder ready (v3, per-car tracking). Drive a full lap, then run PolyAI.listCars() to see counts, then PolyAI.downloadCheckpoints()');
})();
</script>
