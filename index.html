<script>
(function () {
  const state = {};
  const deadIds = new Set();
  const workerRefs = [];
  let checkpointPositions = {};
  window.__lastCkpt = 0;

  const OriginalWorker = window.Worker;
  window.Worker = function (...args) {
    const w = new OriginalWorker(...args);
    try {
      if (args[0] && String(args[0]).includes('simulation_worker')) {
        workerRefs.push(w);
        w.addEventListener('error', (e) => { for (const id of Object.keys(state)) deadIds.add(Number(id)); });
        console.log('[PolyAI] captured simulation worker');
      }
    } catch (e) {}
    return w;
  };
  window.Worker.prototype = OriginalWorker.prototype;

  function isSmallInt(k) { return typeof k === 'number' && Number.isInteger(k) && k >= 0 && k < 100000; }

  const OriginalMapSet = Map.prototype.set;
  Map.prototype.set = function (key, value) {
    if (isSmallInt(key) && typeof value === 'function' && !value.__isSpyWrapped) {
      const wrapped = function (...args) {
        try {
          const arg = args[0];
          if (arg && typeof arg === 'object' && 'speedKmh' in arg && 'position' in arg) {
            state[key] = arg;
            deadIds.delete(key);
            if (arg.nextCheckpointIndex > window.__lastCkpt || checkpointPositions[0] == null) {
              const idx = arg.nextCheckpointIndex - 1 >= 0 ? arg.nextCheckpointIndex - 1 : 0;
              if (checkpointPositions[idx] == null) {
                checkpointPositions[idx] = { x: arg.position.x, z: arg.position.z };
                console.log(`%c[PolyAI] Recorded checkpoint ${idx}: x=${arg.position.x.toFixed(1)}, z=${arg.position.z.toFixed(1)}`, 'color: lime');
              }
              window.__lastCkpt = arg.nextCheckpointIndex;
            }
          }
        } catch (e) {}
        return value.apply(this, args);
      };
      wrapped.__isSpyWrapped = true;
      return OriginalMapSet.call(this, key, wrapped);
    }
    return OriginalMapSet.call(this, key, value);
  };

  window.PolyAI = {
    getCheckpoints() { return checkpointPositions; },
    downloadCheckpoints() {
      const list = Object.keys(checkpointPositions).map(Number).sort((a, b) => a - b).map(i => checkpointPositions[i]);
      const blob = new Blob([JSON.stringify(list)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'checkpoints.json'; a.click();
      console.log('[PolyAI] Downloaded', list.length, 'checkpoints');
    },
  };

  console.log('[PolyAI] Checkpoint recorder ready (v2, no auto-drive). Drive one full lap manually, then run: PolyAI.downloadCheckpoints()');
})();
</script>
