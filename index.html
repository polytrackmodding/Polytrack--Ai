<script>
(function () {
  const state = {};
  let workerRef = null;

  const OriginalWorker = window.Worker;
  window.Worker = function (...args) {
    const w = new OriginalWorker(...args);
    try {
      if (args[0] && String(args[0]).includes('simulation_worker')) {
        workerRef = w;
        console.log('[PolyAI] captured simulation worker reference');
      }
    } catch (e) {}
    return w;
  };
  window.Worker.prototype = OriginalWorker.prototype;

  const OriginalMapSet = Map.prototype.set;
  Map.prototype.set = function (key, value) {
    if (typeof value === 'function' && !value.__isSpyWrapped) {
      const wrapped = function (...args) {
        try {
          const arg = args[0];
          if (arg && typeof arg === 'object' && 'speedKmh' in arg && 'position' in arg) {
            state[key] = arg;
          }
        } catch (e) {}
        return value.apply(this, args);
      };
      wrapped.__isSpyWrapped = true;
      return OriginalMapSet.call(this, key, wrapped);
    }
    return OriginalMapSet.call(this, key, value);
  };

  window.PolyAI = {
    getState(carId) {
      if (carId !== undefined) return state[carId];
      const ids = Object.keys(state);
      return ids.length ? state[ids[0]] : null;
    },
    getCarIds() {
      return Object.keys(state).map(Number);
    },
    control(carId, { up = false, right = false, down = false, left = false, reset = false } = {}) {
      if (!workerRef) { console.warn('[PolyAI] worker not ready yet'); return; }
      workerRef.postMessage({ messageType: 6, carId, up, right, down, left, reset });
    }
  };

  console.log('[PolyAI] ready. Try: PolyAI.getCarIds(), PolyAI.getState(id), PolyAI.control(id, {up:true})');
})();
</script>
